services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-rag_platform}
      UPLOAD_DIR: /app/backend/uploads
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      FRONTEND_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploaded-pdfs:/app/backend/uploads
      - model-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
  uploaded-pdfs:
  model-cache:
